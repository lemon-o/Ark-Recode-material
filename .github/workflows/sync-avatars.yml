name: Sync Avatars

on:
  schedule:
    # wiki 每日 18:00-18:30（北京）刷新，之后与次日凌晨各扫一次
    - cron: "0 11 * * *"   # 北京 19:00
    - cron: "0 23 * * *"   # 北京 07:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只扫描不抓取"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-avatars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # UnityPy 只装在这一处：它带的那几个原生扩展在 Android 上没有 wheel，
      # 正是把抓图挪到 runner 上跑的起因。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx==0.28.1" UnityPy

      # --target 给绝对路径：脚本内部调 fetch_assets.py 时会把 cwd 换到脚本
      # 所在目录，相对路径会被解析到那边去。
      # 本仓库里已有的 PNG 就是「已知」集合，所以不需要状态文件；
      # 没有缺口时脚本连 CDN 都不会碰。
      # set -o pipefail 不能省：`python ... | tee` 的退出码取自 tee，
      # 脚本抛错会被吞掉、步骤照样显示成功，cron 就静默失效了。
      - name: 扫描 wiki 并抓取新头像
        run: |
          set -o pipefail
          python tools/watch_new_units.py \
            --target "$GITHUB_WORKSPACE" \
            --include-existing \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee report.txt
          {
            echo '## Sync Avatars'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成清单并提交
        if: ${{ !inputs.dry_run }}
        run: |
          python tools/build_index.py
          if [ -z "$(git status --porcelain avatars index.json)" ]; then
            echo "没有新头像，无需提交。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatars index.json
          git commit -m "chore(素材): 同步新团员首发头像 [skip ci]"
          git push
