name: Sync Assets

on:
  schedule:
    # 1. 周三游戏维护日（北京时间 14:00 - 20:00，对应 UTC 06:00 - 12:00）：每 20 分钟高频探测
    - cron: "*/20 6-12 * * 3"
    # 2. 其余日常时间段：每 2 小时轻量探活一次
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制全量扫描抓取（跳过 Catalog 变动检查）"
        type: boolean
        default: false
      dry_run:
        description: "只扫描不写入与提交"
        type: boolean
        default: false
  repository_dispatch:
    types: [game_updated, catalog_updated, sync_assets]

permissions:
  contents: write

concurrency:
  group: sync-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装轻量检测依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx==0.28.1"

      - name: 检查游戏 Catalog 版本变动
        id: check
        run: |
          FORCE_FLAG="${{ (inputs.force || github.event_name == 'repository_dispatch') && '--force' || '' }}"
          python tools/check_version.py $FORCE_FLAG

      - name: 安装完整提取依赖 (仅版本有变动或强制运行)
        if: ${{ steps.check.outputs.changed == 'true' || inputs.force || github.event_name == 'repository_dispatch' }}
        run: |
          python -m pip install UnityPy

      - name: 校验头像 ID 重映射表可读
        if: ${{ steps.check.outputs.changed == 'true' || inputs.force || github.event_name == 'repository_dispatch' }}
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          path = pathlib.Path("tools/sync_assets.py")
          if not path.is_file():
              sys.exit("缺少 tools/sync_assets.py：AVATAR_ID_REMAP 读不到，"
                       "头像会按资产 ID 输出（H801 而不是 H804）")
          for node in ast.parse(path.read_text(encoding="utf-8")).body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(t, ast.Name) and t.id == "AVATAR_ID_REMAP"
                  for t in node.targets
              ):
                  continue
              table = ast.literal_eval(node.value)
              if not isinstance(table, dict) or not table:
                  sys.exit("AVATAR_ID_REMAP 为空表：重映射等于没做")
              print("AVATAR_ID_REMAP =", table)
              break
          else:
              sys.exit("tools/sync_assets.py 里找不到 AVATAR_ID_REMAP")
          PY

      - name: 从 CDN 提取最新素材
        if: ${{ steps.check.outputs.changed == 'true' || inputs.force || github.event_name == 'repository_dispatch' }}
        run: |
          set -o pipefail
          mkdir -p build
          python tools/fetch_assets.py \
            --only avatars,heads,skills,icons,atlas,banner,data \
            --target "$GITHUB_WORKSPACE" \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee build/report.txt
          {
            echo '## Sync Assets Report'
            echo '```'
            cat build/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成清单并提交
        if: ${{ !inputs.dry_run && (steps.check.outputs.changed == 'true' || inputs.force || github.event_name == 'repository_dispatch') }}
        run: |
          python tools/check_version.py --save
          python tools/build_index.py
          python tools/update_readme.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有新素材变动，无需提交。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          CATALOG_TAG="${{ steps.check.outputs.catalog || 'latest' }}"
          git commit -m "chore(素材): 同步游戏更新素材 (catalog: ${CATALOG_TAG}) [skip ci]"
          git push
